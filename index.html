<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班級課表對照機 V3</title>
    <link rel="stylesheet" href="style_v3.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div id="errorOverlay" class="error-overlay" style="display: none;">
        <div class="error-content">
            <span class="error-icon">⚠️</span>
            <h2>系統載入失敗</h2>
            <div id="errorMessage" class="error-stack"></div>
            <button class="retry-btn" onclick="location.reload()">重新整理系統</button>
        </div>
    </div>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo-mini">
                <span class="icon">📅</span>
                <h1>對照機</h1>
            </div>

            <!-- 🆕 行事曆提醒區塊 -->
            <div id="calendarAlerts" class="calendar-alerts">
                <!-- 由 JS 動態注入內容 -->
            </div>

            <div class="control-box">
                <div class="selection-card">
                    <div class="picker-group">
                        <div class="picker-header">
                            <span class="dot a"></span> 選擇班級 A
                            <span id="selectedA" class="selected-label">請點選...</span>
                        </div>
                        <div id="gridA" class="class-grid"></div>
                    </div>
                    
                    <div class="vs-divider">
                        <span>VS</span>
                    </div>

                    <div class="picker-group">
                        <div class="picker-header">
                            <span class="dot b"></span> 選擇班級 B
                            <span id="selectedB" class="selected-label">請點選...</span>
                        </div>
                        <div id="gridB" class="class-grid"></div>
                    </div>
                </div>
            </div>

            <div class="info-box">
                <div class="stats-large" id="matchStats">找到 0 個時段</div>
                <div class="legend-vertical">
                    <div class="legend-item"><span class="box match-pe"></span> 雙班體育</div>
                    <div class="legend-item"><span class="box match-skill"></span> 雙藝能課</div>
                    <div class="legend-item"><span class="box disabled"></span> 正課不開放</div>
                </div>
            </div>

            <div class="filter-box">
                <div class="filter-header">
                    <h2>可排科目設定</h2>
                    <div class="filter-actions">
                        <button class="btn-sm" onclick="selectAllFilters(true)">全選</button>
                        <button class="btn-sm" onclick="selectAllFilters(false)">全不選</button>
                    </div>
                </div>
                <input type="text" id="subjectSearch" placeholder="搜尋科目..." class="filter-search">
                <div id="subjectFilters" class="filter-list">
                    <!-- Checkboxes generated by JS -->
                </div>
            </div>

            <p class="footer-note">114-2 學期課表</p>
        </aside>

        <main class="main-content">
            <div class="schedule-wrapper">
                <table id="comparisonTable">
                    <thead>
                        <tr>
                            <th width="10%">節次</th>
                            <th>週一</th>
                            <th>週二</th>
                            <th>週三</th>
                            <th>週四</th>
                            <th>週五</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Content -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <footer>
        <p>&copy; 2026 課表對照系統 - 助力賽程排定</p>
    </footer>

    <script src="app_v3.js"></script>
</body>
</html>
