<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>排課對照系統 - 羽球盃賽版</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="index.css">
</head>
<body>

<nav class="main-tabs">
    <button class="tab-btn active" data-tab="comparison"><i class="fas fa-th-list"></i> 課表對照</button>
    <button class="tab-btn" data-tab="scheduling"><i class="fas fa-calendar-check"></i> 賽程規畫</button>
</nav>

<!-- Tab 1: Comparison -->
<div class="tab-content active" id="tab-comparison">
    <div class="app-layout">
        <aside class="sidebar">
            <section class="panel">
                <div class="panel-header">
                    <span class="panel-icon">🏫</span>
                    <h2 class="panel-title">班級選取</h2>
                    <button class="action-link" id="btnClearClasses">清空</button>
                </div>
                <div class="class-picker" id="classPicker">
                    <!-- JS generated -->
                </div>
            </section>
            
            <section class="panel">
                <div class="panel-header">
                    <span class="panel-icon">⚙️</span>
                    <h2 class="panel-title">可排科目</h2>
                </div>
                <input type="search" id="subjectSearch" class="search-input" placeholder="🔍 搜尋科目...">
                <div class="subject-list" id="subjectList"></div>
            </section>
        </aside>

        <main class="main-content">
            <div class="table-controls">
                <div class="week-nav">
                    <button class="nav-btn" id="btnPrevWeek"><i class="fas fa-chevron-left"></i></button>
                    <h3 id="weekRange">載入中...</h3>
                    <button class="nav-btn" id="btnNextWeek"><i class="fas fa-chevron-right"></i></button>
                    <button class="nav-btn" id="btnToday">今天</button>
                </div>
                <div class="selected-summary" id="selectedChips"></div>
            </div>

            <div class="stat-bar">
                <div class="stat-item" id="statSelected">已選 <strong>0</strong> 班</div>
                <div class="stat-item" id="statMatch">推薦時段 <strong>0</strong> 個</div>
                <div class="stat-item" id="statPE">體育時段 <strong>0</strong> 個</div>
            </div>

            <div id="conflictBanner" class="conflict-banner" style="display:none"></div>

            <div class="table-wrapper" id="tableWrapper">
                <div class="empty-state" id="emptyState">
                    <div class="empty-icon">🏆</div>
                    <p>請在左側選擇班級</p>
                </div>
                <div class="table-scroll" id="tableScroll" style="display:none">
                    <table class="schedule-table" id="scheduleTable">
                        <thead id="tableHead"></thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Tab 2: Scheduling -->
<div class="tab-content" id="tab-scheduling">
    <div class="app-layout">
        <aside class="sidebar">
            <section class="panel">
                <div class="panel-header">
                    <span class="panel-icon">📝</span>
                    <h2 class="panel-title">待排賽事</h2>
                </div>
                <input type="search" id="matchSearch" class="search-input" placeholder="🔍 搜尋盃賽/班級...">
                <div class="match-list" id="pendingMatchList"></div>
            </section>
        </aside>

        <main class="main-content">
            <div class="schedule-header">
                <h2 id="currentSchedulingMatch">請先從左側選擇賽事</h2>
                <div id="schedulingTips" style="display:none">💡 點選下方推薦時段即可排入賽程</div>
            </div>
            
            <div class="table-wrapper">
                <div id="schedulingEmpty" class="empty-state"><div class="empty-icon">📅</div><p>尚未選擇賽事</p></div>
                <div id="schedulingTableScroll" class="table-scroll" style="display:none">
                    <table class="schedule-table" id="schedulingTable">
                        <thead id="schedulingTableHead"></thead>
                        <tbody id="schedulingTableBody"></tbody>
                    </table>
                </div>
            </div>

            <div class="scheduled-panel" id="scheduledPanel">
                <div class="panel-header-row">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <h3 class="panel-title">📅 已排定賽程</h3>
                        <button onclick="document.getElementById('scheduledPanel').classList.toggle('collapsed')" class="btn-toggle-ui">收合介面</button>
                    </div>
                    <div class="panel-actions">
                        <input type="file" id="importFile" accept=".json" style="display:none" onchange="importScheduleData(event)">
                        <button class="btn-action" onclick="document.getElementById('importFile').click()">匯入</button>
                        <button class="btn-action" onclick="exportScheduleData()">下載</button>
                        <button class="btn-action" onclick="location.reload()" style="background:#3b82f6;color:white">更新</button>
                        <button class="btn-action" onclick="clearAllSchedules()" style="background:#ef4444;color:white">清空</button>
                    </div>
                </div>
                <div class="scheduled-grid" id="scheduledGrid"></div>
            </div>
        </main>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js?v=20260420_final_fix"></script>
</body>
</html>
