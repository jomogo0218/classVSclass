<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>排課配課系統 — 114學年度第二學期</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="app.css?v=20260418c">
</head>
<body>

<!-- ========== TOP NAVIGATION BAR ========== -->
<header class="topbar">
    <div class="topbar-brand">
        <span class="brand-icon">📅</span>
        <div>
            <div class="brand-title">排課配課系統</div>
            <div class="brand-sub">114學年度 第二學期</div>
        </div>
    </div>

    <div class="topbar-week">
        <button class="week-btn" id="btnPrevWeek">&#9664;</button>
        <div class="week-info">
            <span id="weekLabel" class="week-label">本週</span>
            <span id="weekRange" class="week-range">載入中...</span>
        </div>
        <button class="week-btn" id="btnNextWeek">&#9654;</button>
        <button class="week-btn today-btn" id="btnToday">本週</button>
    </div>

    <div id="conflictBanner" class="conflict-banner" style="display:none"></div>
</header>

<!-- ========== MAIN LAYOUT ========== -->
<div class="app-layout">

    <!-- LEFT SIDEBAR -->
    <aside class="sidebar" id="sidebar">

        <!-- CLASS SELECTOR -->
        <section class="panel">
            <div class="panel-header">
                <span class="panel-icon">🏫</span>
                <h2 class="panel-title">選擇班級</h2>
                <button class="clear-btn" id="btnClearClasses" title="清除所有選擇">✕ 清除</button>
            </div>
            <div class="selected-chips" id="selectedChips">
                <span class="no-selection-hint">請點選下方班級（可多選）</span>
            </div>
            <div class="class-picker" id="classPicker">
                <!-- JS generated -->
            </div>
        </section>

        <!-- SUBJECT SETTINGS -->
        <section class="panel subject-panel">
            <div class="panel-header">
                <span class="panel-icon">⚙️</span>
                <h2 class="panel-title">可排科目</h2>
                <div class="subject-actions">
                    <button class="action-link" id="btnSelectAll">全選</button>
                    <span class="sep">|</span>
                    <button class="action-link" id="btnDeselectAll">全不選</button>
                </div>
            </div>
            <input type="search" id="subjectSearch" class="search-input" placeholder="🔍 搜尋科目...">
            <div class="subject-list" id="subjectList">
                <!-- JS generated -->
            </div>
            <p class="setting-note">💾 設定自動儲存</p>
        </section>

        <!-- LEGEND -->
        <section class="panel legend-panel">
            <div class="legend-row"><span class="legend-dot pe"></span>全班體育時段</div>
            <div class="legend-row"><span class="legend-dot skill"></span>全班可排時段</div>
            <div class="legend-row"><span class="legend-dot partial"></span>部分班可排</div>
            <div class="legend-row"><span class="legend-dot blocked"></span>含正課（不可排）</div>
        </section>

    </aside>

    <!-- MOBILE SIDEBAR TOGGLE -->
    <button class="sidebar-toggle" id="sidebarToggle">⚙️ 設定</button>

    <!-- MAIN CONTENT -->
    <main class="main-content">

        <!-- STATS BAR -->
        <div class="stats-bar" id="statsBar">
            <div class="stat-item" id="statSelected">已選 <strong>0</strong> 班</div>
            <div class="stat-item" id="statMatch">推薦時段 <strong>0</strong> 個</div>
            <div class="stat-item" id="statPE">體育時段 <strong>0</strong> 個</div>
        </div>

        <!-- SCHEDULE TABLE WRAPPER -->
        <div class="table-wrapper" id="tableWrapper">
            <div class="empty-state" id="emptyState">
                <div class="empty-icon">🏆</div>
                <p>請在左側選擇班級</p>
                <p class="empty-sub">可以選擇多個班級進行對照</p>
            </div>
            <div class="table-scroll" id="tableScroll" style="display:none">
                <table class="schedule-table" id="scheduleTable">
                    <thead id="tableHead"></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>

    </main>
</div>

<!-- MOBILE OVERLAY -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- ERROR MODAL -->
<div class="error-modal" id="errorModal" style="display:none">
    <div class="error-box">
        <div class="error-icon">❌</div>
        <h3>載入失敗</h3>
        <pre id="errorMsg"></pre>
        <button onclick="location.reload()">重新整理</button>
    </div>
</div>

<script src="app.js?v=20260418b"></script>
</body>
</html>
