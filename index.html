<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>排課配課系統 - 專業商務版</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="app.css?v=standard_v6">
</head>
<body>

<nav class="main-tabs">
    <button class="tab-btn active" data-tab="comparison"><i class="fas fa-th-list"></i> 課表對照</button>
    <button class="tab-btn" data-tab="scheduling"><i class="fas fa-calendar-check"></i> 賽程規畫</button>
</nav>

<div class="tab-content active" id="tab-comparison">
    <div class="app-layout">
        <aside class="sidebar">
            <section class="panel">
                <div class="panel-header">
                    <h2 class="panel-title">🏫 班級選取</h2>
                    <button class="action-link" id="btnClearClasses">清空</button>
                </div>
                <div class="class-picker" id="classPicker"></div>
            </section>
            <section class="panel">
                <div class="panel-header">
                    <h2 class="panel-title">⚙️ 可排科目</h2>
                </div>
                <input type="search" id="subjectSearch" class="search-input" placeholder="🔍 搜尋科目...">
                <div class="subject-list" id="subjectList" style="max-height: 200px; overflow-y: auto;"></div>
            </section>
            <section class="panel">
                <div class="legend-row"><span style="display:inline-block;width:12px;height:12px;background:#fff7ed;border:1px solid #c2410c;margin-right:8px;"></span>體育</div>
                <div class="legend-row"><span style="display:inline-block;width:12px;height:12px;background:#eff6ff;border:1px solid #1d4ed8;margin-right:8px;"></span>全班可排</div>
            </section>
        </aside>

        <main class="main-content">
            <div class="table-controls">
                <div class="week-nav">
                    <button class="nav-btn" id="btnPrevWeek"><i class="fas fa-chevron-left"></i></button>
                    <div style="text-align:center">
                        <span id="weekLabel" style="font-size:0.75rem; color:#2563eb; font-weight:bold; display:block"></span>
                        <h3 id="weekRange">載入中...</h3>
                    </div>
                    <button class="nav-btn" id="btnNextWeek"><i class="fas fa-chevron-right"></i></button>
                    <button class="nav-btn" id="btnToday">今天</button>
                </div>
                <div class="selected-summary" id="selectedChips"></div>
            </div>
            <div id="conflictBanner" style="background:#fef2f2; color:#991b1b; padding:8px 16px; border-bottom:1px solid #fecaca; font-weight:bold; display:none"></div>
            <div class="table-wrapper">
                <div class="table-scroll">
                    <table class="schedule-table" id="scheduleTable">
                        <thead id="tableHead"></thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<div class="tab-content" id="tab-scheduling">
    <div class="app-layout">
        <aside class="sidebar">
            <section class="panel">
                <div class="panel-header"><h2 class="panel-title">📝 待排賽事</h2></div>
                <input type="search" id="matchSearch" class="search-input" placeholder="🔍 搜尋盃賽/班級...">
                <div class="match-list" id="pendingMatchList"></div>
            </section>
        </aside>
        <main class="main-content">
            <div class="schedule-header">
                <h2 id="currentSchedulingMatch">請先選擇賽事</h2>
                <div id="schedulingTips" style="color:#b45309; font-size:0.8rem; margin-top:4px; display:none">💡 點擊下方時段即可排入</div>
            </div>
            <div class="table-wrapper">
                <div class="table-scroll">
                    <table class="schedule-table" id="schedulingTable">
                        <thead id="schedulingTableHead"></thead>
                        <tbody id="schedulingTableBody"></tbody>
                    </table>
                </div>
            </div>
            <div class="scheduled-panel" id="scheduledPanel">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem">
                    <h3 style="font-size:1.1rem; font-weight:700">📅 已排定列表</h3>
                    <div style="display:flex; gap:8px">
                        <button class="btn-action" onclick="location.reload()" style="background:#2563eb; color:#fff">更新</button>
                        <button class="btn-action" onclick="clearAllSchedules()" style="background:#ef4444; color:#fff">🗑️ 清空</button>
                        <button class="btn-action" onclick="exportSchedule()"><i class="fas fa-print"></i> 列印</button>
                    </div>
                </div>
                <div class="scheduled-grid" id="scheduledGrid"></div>
            </div>
        </main>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js?v=standard_v6"></script>
</body>
</html>
